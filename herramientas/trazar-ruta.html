<meta charset="utf-8">
<title>INMOL · Trazar una ruta de acceso</title>
<!-- ============================================================================
     INMOL · Panel interactivo
     trazar-ruta.html — Redibuja un recorrido de acceso sobre el satelital
     ----------------------------------------------------------------------------
     PARA QUÉ SIRVE
     Las rutas de acceso salieron de un motor de rutas y de los planos de INMOL,
     y a veces no coinciden con lo que hay hoy en la calle: un puente nuevo, una
     calle que se abrió, un tramo que se cerró. Además la foto satelital que
     lleva el panel es de hace unos años, así que lo nuevo no se ve en ella.

     Acá se abre la ruta que el panel tiene cargada, se arrastra el tramo que
     esté mal —o se rehace de cero— y sale el trazado listo para pegar en
     js/rutas.js.

     CÓMO SE USA
       1. Abrir este archivo con doble clic (funciona sin conexión).
       2. Elegir el proyecto y la ruta arriba. Aparece el trazado actual.
       3. «Editar»: cada punto se puede arrastrar; con clic sobre el mapa se
          agrega uno al final; «Deshacer» saca el último.
          «Rehacer desde cero» borra todo y se traza haciendo clic.
       4. «Copiar para rutas.js» y pegar el resultado en el archivo.

     Va mostrando el largo del recorrido en kilómetros, que es la forma rápida
     de darse cuenta si un tramo quedó dando una vuelta de más.

     SÓLO PARA DESARROLLO. El panel de feria no usa este archivo.
     ============================================================================ -->
<link rel="stylesheet" href="../assets/leaflet/leaflet.css">
<style>
  :root { --rojo: #E3333E; --morado: #7B2FD6; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; color: #111; }
  #barra {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 18px; background: #F7FAFC; border-bottom: 1px solid #E2E8F0;
  }
  #barra b { font-size: 16px; }
  select, button {
    font: inherit; padding: 7px 13px; border-radius: 8px;
    border: 1px solid #CBD5E0; background: #fff; cursor: pointer;
  }
  button.principal { background: var(--morado); border-color: var(--morado); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  #medida {
    padding: 9px 18px; background: #FFF7E6; border-bottom: 1px solid #F0E0B8;
    font-size: 14px;
  }
  #medida span { font-variant-numeric: tabular-nums; font-weight: 600; }
  #mapa { position: absolute; inset: 0; top: auto; height: calc(100vh - 118px); }
  .nodo {
    width: 13px; height: 13px; margin: -6px 0 0 -6px; border-radius: 50%;
    background: #fff; border: 3px solid var(--morado); cursor: grab;
  }
  .nodo.punta { border-color: var(--rojo); background: var(--rojo); }
</style>

<div id="barra">
  <b>Trazar una ruta</b>
  <select id="proyecto"></select>
  <select id="ruta"></select>
  <button id="editar">Editar</button>
  <button id="cero">Rehacer desde cero</button>
  <button id="deshacer" disabled>Deshacer</button>
  <button id="copiar" class="principal" disabled>Copiar para rutas.js</button>
</div>
<div id="medida">Largo del recorrido: <span id="km">—</span> · puntos: <span id="n">0</span></div>
<div id="mapa"></div>

<script src="../assets/leaflet/leaflet.js"></script>
<script src="../js/rutas.js"></script>
<script src="../js/predios.js"></script>
<script>
/* Se copia la ruta cargada, no se toca la original: si el trazo nuevo sale
   peor, alcanza con volver a elegir la ruta en el selector. */
const $ = s => document.querySelector(s);
let proy = 'libertad', iRuta = 0, puntos = [], linea = null, nodos = [], editando = false;

const mapa = L.map('mapa', { zoomControl: true }).setView([-17.8878, -63.1739], 16);
let capa = null;

function teselas() {
  if (capa) mapa.removeLayer(capa);
  capa = L.tileLayer(`../assets/tiles/${proy}/{z}/{x}/{y}.jpg`, {
    minZoom: 12, maxZoom: 19,
    attribution: '© Esri — imágenes descargadas para el panel'
  }).addTo(mapa);
}

const metros = (a, b) => mapa.distance(a, b);

function largo() {
  let L = 0;
  for (let i = 1; i < puntos.length; i++) L += metros(puntos[i - 1], puntos[i]);
  return L;
}

function pintar() {
  if (linea) mapa.removeLayer(linea);
  nodos.forEach(n => mapa.removeLayer(n));
  nodos = [];

  linea = L.polyline(puntos, { color: '#7B2FD6', weight: 5, opacity: .95 }).addTo(mapa);

  /* Con 300 y pico de puntos poner un marcador en cada uno vuelve la página
     inusable, así que sólo se hacen arrastrables las puntas y uno de cada
     diez. Para un retoque fino conviene rehacer el tramo. */
  puntos.forEach((p, i) => {
    const punta = i === 0 || i === puntos.length - 1;
    if (!editando || (!punta && i % 10 !== 0)) return;
    const m = L.marker(p, {
      draggable: true,
      icon: L.divIcon({ className: '', html: `<div class="nodo${punta ? ' punta' : ''}"></div>`, iconSize: [13, 13] })
    }).addTo(mapa);
    m.on('drag', e => { puntos[i] = [e.latlng.lat, e.latlng.lng]; redibujarLinea(); });
    m.on('dragend', medir);
    nodos.push(m);
  });
  medir();
}

function redibujarLinea() { if (linea) linea.setLatLngs(puntos); }

function medir() {
  $('#km').textContent = puntos.length > 1 ? (largo() / 1000).toFixed(2) + ' km' : '—';
  $('#n').textContent = puntos.length;
  $('#deshacer').disabled = !puntos.length;
  $('#copiar').disabled = puntos.length < 2;
}

function cargar() {
  const r = RUTAS[proy][iRuta];
  puntos = r.puntos.map(p => p.slice());
  editando = false;
  pintar();
  if (puntos.length) mapa.fitBounds(L.latLngBounds(puntos), { padding: [40, 40] });
}

mapa.on('click', e => {
  if (!editando) return;
  puntos.push([+e.latlng.lat.toFixed(6), +e.latlng.lng.toFixed(6)]);
  pintar();
});

$('#editar').onclick = () => { editando = !editando; $('#editar').textContent = editando ? 'Dejar de editar' : 'Editar'; pintar(); };
$('#cero').onclick = () => { puntos = []; editando = true; $('#editar').textContent = 'Dejar de editar'; pintar(); };
$('#deshacer').onclick = () => { puntos.pop(); pintar(); };
$('#copiar').onclick = () => {
  const r = RUTAS[proy][iRuta];
  const txt = JSON.stringify({ nombre: r.nombre, desde: r.desde, color: r.color, puntos });
  navigator.clipboard.writeText(txt).then(
    () => alert(`Copiado: ${puntos.length} puntos, ${(largo() / 1000).toFixed(2)} km.\n\n` +
                `Reemplazá con esto el objeto de «${r.nombre}» dentro de "${proy}" en js/rutas.js.`),
    () => prompt('Copiá esto a mano:', txt));
};

$('#proyecto').onchange = e => { proy = e.target.value; teselas(); llenarRutas(); cargar(); };
$('#ruta').onchange = e => { iRuta = +e.target.value; cargar(); };

function llenarRutas() {
  $('#ruta').innerHTML = RUTAS[proy]
    .map((r, i) => `<option value="${i}">${r.nombre} · ${r.desde}</option>`).join('');
  iRuta = 0;
}

$('#proyecto').innerHTML = Object.keys(RUTAS).map(p => `<option value="${p}">${p}</option>`).join('');
$('#proyecto').value = proy;
teselas();
llenarRutas();
cargar();
</script>
